name: Android Internal Testing

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-internal.yml'
      - 'android/**'
      - 'assets/**'
      - 'lib/**'
      - 'pubspec.lock'
      - 'pubspec.yaml'
  workflow_dispatch:

concurrency:
  group: android-internal-main
  cancel-in-progress: true

jobs:
  upload-internal:
    name: Build and upload to Google Play internal testing
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the build number can be derived from commit count

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate Dart code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install Android signing assets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | base64 --decode > android/app/conduit-keystore.jks
          printf '%s' '${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}' | base64 --decode > android/key.properties
          test -s android/app/conduit-keystore.jks
          test -s android/key.properties

      # Build number = total commit count: unique and monotonic per upload.
      # The version name comes from pubspec.yaml.
      - name: Build signed Android App Bundle
        run: |
          flutter build appbundle \
            --release \
            --build-number "$(git rev-list --count HEAD)"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-internal-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ai.public.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
